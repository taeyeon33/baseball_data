<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <!-- 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <title>NPB Stats</title>
</head>

<body>
    <header class="d-flex justify-content-between align-items-center p-3 text-white">
        <div class="logo">
            <a href="/">
                <span class="pe-1">⚾</span>
                <span class="pb-1">Baseball Stats</span>
            </a>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <button id="indexBtn" class="fw-bold">통계로 돌아가기</button>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm">로그아웃</button>
            <button id="themeBtn">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </header>

    <main class="container-fluid px-5 py-3 my-4">
        <div id="dataManagement">
            <div class="card shadow border-0 overflow-hidden">
                <div class="card-header bg-transparent p-0 border-bottom border-secandary-subtle">
                    <div class="d-flex justify-content-between align-items-center bg-card-bg px-4 py-3">
                        <h3 id="currentTableTitle" class="fw-bold fs-4 mb-0">players</h3>
                        <div class="d-flex gap-3">
                            <div class="d-flex gap-2 align-items-center me-2">
                                <label for="crawlDate" class="small text-body-secondary fw-bold">크롤링 기간: </label>
                                <div class="date-selector input-group input-group-sm">
                                    <span class="input-group-text bg-transparent border-secondary-subtle text-primary border-end-0">
                                        <i class="bi bi-calendar3"></i>
                                    </span>
                                    <input type="text" id="crawlDate" class="form-control border-secondary-subtle bg-transparent text-center border-start-0 ps-0" placeholder="기간 선택" readonly>
                                </div>
                                <button id="crawlBtn" class="btn btn-sm px-3 shadow-sm d-flex align-items-center gap-1">
                                    <i class="bi bi-rocket-takeoff-fill"></i>
                                    <span>데이터 가져오기</span>
                                </button>
                            </div>
                            <button id="dataInsertBtn" class="btn btn-outline-primary btn-sm">데이터 추가</button>
                            <button id="dataFilter" class="btn btn-outline-info btn-sm">필터</button>
                        </div>
                    </div>
                    <ul id="navTabs" class="nav nav-tabs px-3 py-2 bg-light-subtle">
                        <li class="nav-item">테이블 로딩중입니다.</li>
                    </ul>
                </div>
                <div class="card-body p-0">
                    <div class="table-container border-0 rounded-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr id="tableThead">
                                    <th>데이터 로딩중입니다.</th>
                                </tr>
                            </thead>
                            <tbody id="tableTbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p class="mb-0">&copy; 2025 NPB Stats. All rights reserved.</p>
    </footer>

    <div id="dataModal" class="modal-backdrop-custom" style="display: none;">
        <div class="modal-dialog-custom">
            <div class="card shadow-lg">
                <div class="card-header border-bottom border-secondary-subtle p-3 d-flex justify-content-between align-items-center">
                    <h5 id="modalTitle" class="card-title fw-bold m-0">players</h5>
                    <button id="closeBtn" class="btn-close"></button>
                </div>
                <div class="card-body p-4">
                    <form id="modalForm">
                        <div class="row g-3"></div>
                        <div class="mt-4 text-end">
                            <button id="cancelBtn" class="btn btn-secondary btn-sm me-2">취소</button>
                            <button id="updateBtn" class="btn btn-primary btn-sm">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
    <script type="module" src="/static/js/page/admin.js"></script>
    <script type="module" src="/static/js/page/crawl_popup.js"></script>
    <script src="/static/js/page/flatpickr.js"></script>
</body>

</html>
