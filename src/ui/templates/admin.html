<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <!-- 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>NPB Stats</title>
</head>

<body>
    <header class="d-flex justify-content-between align-items-center p-3 text-white">
        <div class="logo">
            <a href="/">
                <span class="pe-1">⚾</span>
                <span class="pb-1">Baseball Stats</span>
            </a>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <button id="indexBtn" class="fw-bold">통계로 돌아가기</button>
            <button id="themeBtn">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </header>

    <main class="container-fluid px-5 py-3 my-4">
        <div id="dataManagement">
            <div class="card shadow-sm border-0 overflow-hidden">
                <div class="card-header bg-transparent p-0 border-bottom border-secandary-subtle">
                    <div class="d-flex justify-content-between align-items-center bg-card-bg px-4 py-3">
                        <h3 id="currentTableTitle" class="fw-bold fs-4 mb-0">선수관리</h3>
                        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">로그아웃</button>
                    </div>
                    <ul class="nav nav-pills px-4 py-2 bg-light-subtle gap-2">
                        <li class="nav-item">
                            <button id="tableMenuBtn1" class="nav-link px-3 active">선수관리</button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-0">
                    <div class="table-container border-0 rounded-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr id="tableThead">
                                    <th>순위</th>
                                    <th>이름</th>
                                    <th>팀</th>
                                    <th>경기</th>
                                    <th>평균자책</th>
                                    <th>승</th>
                                    <th>삼진</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="tableTbody">
                                <tr>
                                    <td>1</td>
                                    <td>양현종</td>
                                    <td>Kiwoom Heroes</td>
                                    <td>54</td>
                                    <td>2.19</td>
                                    <td>17</td>
                                    <td>156</td>
                                    <td class="">
                                        <div class="d-flex justify-content-center gap-1">
                                            <button class="btn btn-sm btn-outline-primary border-0 p-1" onclick="" title="수정">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger border-0 p-1" onclick="" title="삭제">
                                                <i class="bi bi-trash3-fill"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="mb-0">&copy; 2025 NPB Stats. All rights reserved.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script type="module" src="/static/js/page/admin.js"></script>
</body>

</html>
