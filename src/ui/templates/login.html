<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <!-- 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>NPB Stats</title>
</head>

<body>
    <header class="d-flex justify-content-between align-items-center p-3 text-white">
        <div class="logo">
            <a href="/">
                <span class="pe-1">⚾</span>
                <span class="pb-1">Baseball Stats</span>
            </a>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <button id="indexBtn" class="fw-bold">통계로 돌아가기</button>
            <button id="themeBtn">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </header>

    <main class="container py-5 my-4">
        <div id="loginSection" class="row justify-content-center m-0">
            <div class="col-md-5 col-lg-4">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="text-center mb-4 fw-bold">ADMIN LOGIN</h4>
                    <form id="loginForm">
                        <div class="mb-3">
                            <input type="text" name="username" autocomplete="username" style="display: none;">
                            <label for="password" class="form-label text-body-secondary small">Password</label>
                            <input type="password" class="form-control" id="password" required autocomplete="current-password">
                        </div>
                        <button id="submitBtn" class="btn btn-primary w-100 py-2">로그인</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="mb-0">&copy; 2025 NPB Stats. All rights reserved.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script type="module" src="/static/js/page/login.js"></script>
</body>

</html>
